<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack P. Carter | Home</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon-command-line-003087.svg">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Link to fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

    <a href="#main" class="skip-link">Skip to content</a>

    <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
    <!-- HEADER -->
    <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
    <header class="header-container">

        <!-- Logo -->
        <div class="header-content">
            <a href="index.html">
                <div class="logo-container" id="logo">
                    <img src="assets/profile_pic.png" alt="Jack P. Carter" class="logo-avatar">
                    <h3 class="logo-text">
                        Jack P. Carter
                        <img src="assets/favicon-command-line-003087.svg" alt="Command line icon" class="logo-icon">
                    </h3>
                </div>
            </a>

            <!-- Nav menu -->
            <div class="burger-container">
                <button class="burger" id="burger" aria-label="Open menu" aria-controls="menu" aria-expanded="false">
                    <img src="assets/icons/burger.svg" alt="Menu Icon" class="icon" />
                </button>
            </div>

        </div>
        <div class="nav-links-container">
            <nav class="nav-links" id="menu" aria-label="Primary">
                <a href="about.html" class="nav-link">About</a>
                <a href="blog.html" class="nav-link" style="padding-bottom: 1.5em">Blog</a>
            </nav>
        </div>

    </header>


    <main id="main">


        <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
        <!-- MAIN HERO -->
        <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
        <section class="hero-container">
            <div class="hero-text">
                <h1 id="first-hero-text-primary">AI Application<br> Engineer</h1>
            </div>
            <div class="hero-image-container">
                <img src="assets/hero_images/main_hero.jpg" alt="Hero image" />
            </div>
        </section>


        <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
        <!-- ABOUT HERO -->
        <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
        <section class="hero-container-reverse">
            <div class="hero-image-container">
                <img src="assets/hero_images/about_hero.jpg" alt="Hero image" />
            </div>
            <div class="hero-text">
                <a class="hoverable-link" href="about.html">
                    <h1>About</h1>
                </a>
            </div>
        </section>
        

        <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
        <!-- BLOG HERO -->
        <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
        <section class="hero-container">
            <div class="hero-text">
                <a class="hoverable-link" href="blog.html">
                    <h1>Blog</h1>
                </a>
            </div>
            <div class="hero-image-container">
                <img src="assets/hero_images/blog_hero.jpg" alt="Hero image" />
            </div>
        </section>
        

    </main>


    <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
    <!-- FOOTER -->
    <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
    <footer>
        <p>&copy; 2026 Jack P. Carter · AI Application Engineer</p>
    </footer>

    <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
    <!-- JAVASCRIPT -->
    <!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->
    <script src="script.js" defer></script>
</body>

</html>
